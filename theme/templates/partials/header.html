{% load static %}

<header class="sticky top-0 z-50 border-b border-amber-900/20 bg-[#f8f3e9]">
    <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">

        <div class="flex min-h-16 items-center justify-between gap-4 lg:min-h-20">

            <a
                href="{% url 'core:home' %}"
                class="group flex min-w-0 items-center gap-2.5 sm:gap-3"
                aria-label="VARIANZA home"
            >
                <div class="flex h-11 w-11 shrink-0 items-center justify-center sm:h-12 sm:w-12 lg:h-14 lg:w-14">
                    <img
                        src="{% static 'theme/images/emblem.png' %}"
                        alt="VARIANZA emblem"
                        class="max-h-11 max-w-11 object-contain transition-transform duration-200 group-hover:scale-[1.03] sm:max-h-12 sm:max-w-12 lg:max-h-14 lg:max-w-14"
                    >
                </div>

                <div class="min-w-0">
                    <p class="text-[10px] font-semibold uppercase tracking-[0.16em] text-[#7a4e2d] sm:text-xs">
                        OSS
                    </p>

                    <p class="truncate text-base font-black tracking-tight text-[#3f2618] sm:text-lg lg:text-xl">
                        Organization of Statistics Students
                    </p>

                    <p class="hidden text-xs text-[#765c48] sm:block">
                        VARIANZA
                    </p>
                </div>
            </a>

            <nav class="hidden items-center gap-1 lg:flex">

                <a
                    href="{% url 'core:home' %}"
                    class="rounded-lg px-3 py-2 text-sm font-semibold text-[#6f4328] transition hover:bg-[#f3eadc] hover:text-[#3f2618]"
                >
                    Home
                </a>

                <a
                    href="{% url 'core:about' %}"
                    class="rounded-lg px-3 py-2 text-sm font-semibold text-[#6f4328] transition hover:bg-[#f3eadc] hover:text-[#3f2618]"
                >
                    About Us
                </a>

                <a
                    href="{% url 'core:platforms' %}"
                    class="rounded-lg px-3 py-2 text-sm font-semibold text-[#6f4328] transition hover:bg-[#f3eadc] hover:text-[#3f2618]"
                >
                    Platforms
                </a>

            </nav>

            <button
                type="button"
                id="mobile-menu-button"
                aria-expanded="false"
                aria-controls="mobile-menu"
                class="inline-flex h-10 w-10 shrink-0 items-center justify-center rounded-lg border border-[#cdb89f] bg-[#fffdf8] text-[#6f4328] transition hover:border-[#8a5a36] hover:bg-[#f3eadc] lg:hidden"
            >
                <span class="sr-only">Open navigation menu</span>

                <svg
                    id="mobile-menu-icon"
                    class="h-5 w-5"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    aria-hidden="true"
                >
                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M4 6h16M4 12h16M4 18h16"
                    />
                </svg>
            </button>

        </div>

        <div
            id="mobile-menu"
            class="hidden border-t border-[#eadcc9] pb-4 pt-4 lg:hidden"
        >
            <nav class="space-y-1">

                <a
                    href="{% url 'core:home' %}"
                    class="block rounded-lg px-3 py-3 text-sm font-semibold text-[#3f2618] transition hover:bg-[#f3eadc]"
                >
                    Home
                </a>

                <a
                    href="{% url 'core:about' %}"
                    class="block rounded-lg px-3 py-3 text-sm font-semibold text-[#3f2618] transition hover:bg-[#f3eadc]"
                >
                    About Us
                </a>

                <a
                    href="{% url 'core:platforms' %}"
                    class="block rounded-lg px-3 py-3 text-sm font-semibold text-[#3f2618] transition hover:bg-[#f3eadc]"
                >
                    Platforms
                </a>

            </nav>
        </div>

    </div>
</header>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        const button = document.getElementById("mobile-menu-button");
        const menu = document.getElementById("mobile-menu");
        const icon = document.getElementById("mobile-menu-icon");

        if (!button || !menu || !icon) {
            return;
        }

        button.addEventListener("click", function () {
            const isOpen = button.getAttribute("aria-expanded") === "true";

            button.setAttribute("aria-expanded", String(!isOpen));
            menu.classList.toggle("hidden", isOpen);

            icon.innerHTML = isOpen
                ? `
                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M4 6h16M4 12h16M4 18h16"
                    />
                `
                : `
                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M6 6l12 12M6 18L18 6"
                    />
                `;
        });
    });
</script>

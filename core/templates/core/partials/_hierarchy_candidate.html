{% load static %}

{% if candidate %}
    <a
        href="{{ candidate.get_absolute_url }}"
        class="group block {{ link_radius|default:'rounded-xl' }} outline-none"
        aria-label="View {{ candidate.name }}'s credentials and platforms"
    >
        <div class="flex flex-col items-center">

            <div
                class="overflow-hidden rounded-full {{ ring_class|default:'ring-2 ring-[#eadcc9] transition duration-200 group-hover:-translate-y-1 group-hover:ring-[#c9a77e]' }}"
            >
                <img
                    src="{% static candidate.photo %}"
                    alt="{{ candidate.name }}"
                    class="{{ img_size|default:'h-16 w-16 object-cover sm:h-20 sm:w-20' }}"
                >
            </div>

            <div
                class="{{ card_margin|default:'mt-2' }} {{ card_max_width|default:'max-w-[105px] sm:max-w-[150px]' }} {{ card_radius|default:'rounded-lg' }} border border-[#d8c3a8] bg-[#fffaf2] {{ card_padding|default:'px-1.5 py-1.5 sm:px-2 sm:py-2' }} text-center transition duration-200 group-hover:border-[#b88b5a] group-hover:bg-[#fffdf8]"
            >
                <p
                    class="break-words {{ name_size|default:'text-[8px] sm:text-[11px]' }} font-bold uppercase leading-tight text-[#3f2618]"
                >
                    {{ candidate.name }}
                </p>

                <p class="mt-1 text-[9px] font-semibold uppercase tracking-[0.12em] text-[#8a5a36] sm:text-[10px]">
                    {{ candidate.position }}
                </p>
            </div>

        </div>
    </a>
{% endif %}
